<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>OLX OAuth callback</title>
<style>
  :root { --bg: #f7f7f5; --fg: #1d2b2f; --muted: #5b6b70; --box: #ffffff; --line: #d9dedf; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151a1c; --fg: #e8eeef; --muted: #9aa9ad; --box: #1e2528; --line: #2e393c; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 system-ui, -apple-system, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  p { color: var(--muted); margin: 0 0 16px; }
  code { display: block; background: var(--box); border: 1px solid var(--line);
         border-radius: 8px; padding: 12px; word-break: break-all; color: var(--fg); }
  button { margin-top: 12px; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--box); color: var(--fg); cursor: pointer; font: inherit; }
</style>
</head>
<body>
<main>
  <h1 id="title">OLX OAuth callback</h1>
  <p id="msg">Przekazywanie kodu do lokalnego skryptu…</p>
  <div id="manual" hidden>
    <p>Jeśli skrypt nie przejął kodu automatycznie, skopiuj go i wklej w terminalu (nie w czacie):</p>
    <code id="code"></code>
    <button id="copy" type="button">Kopiuj kod</button>
  </div>
</main>
<script>
  // Bounce page for the OLX Partner API redirect_uri. OLX requires a public
  // URL; this page forwards ?code=&state= to the local listener started by
  // `olx oauth` (scripts/auth_oauth.py) and shows the code as a fallback.
  // Nothing is logged or sent anywhere else.
  (function () {
    var q = new URLSearchParams(location.search);
    var code = q.get("code");
    var err = q.get("error");
    var msg = document.getElementById("msg");
    if (err) {
      document.getElementById("title").textContent = "Autoryzacja odrzucona";
      msg.textContent = err + (q.get("error_description") ? ": " + q.get("error_description") : "");
      return;
    }
    if (!code) {
      msg.textContent = "Brak parametru code w adresie.";
      return;
    }
    document.getElementById("code").textContent = code;
    document.getElementById("copy").onclick = function () {
      navigator.clipboard.writeText(code).then(function () {
        document.getElementById("copy").textContent = "Skopiowano";
      });
    };
    history.replaceState(null, "", location.pathname);
    // Hand the code to the local listener in the background; the page stays
    // put so the manual fallback is always reachable.
    fetch("http://localhost:8765/callback?" + q.toString(), { mode: "no-cors" })
      .then(function () {
        msg.textContent = "Kod przekazany do lokalnego skryptu. Możesz zamknąć tę kartę.";
      })
      .catch(function () {
        msg.textContent = "Nie udało się połączyć z lokalnym skryptem.";
        document.getElementById("manual").hidden = false;
      });
  })();
</script>
</body>
</html>
